name: theorem-workbench

x-theorem-security: &theorem-security
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  pids_limit: 1024

services:
  theorem:
    <<: *theorem-security
    build:
      context: .
      target: dev
    image: theorem-workbench:dev
    working_dir: /workspace
    network_mode: "none"
    environment:
      CI: "true"
      NPM_CONFIG_UPDATE_NOTIFIER: "false"
      THEOREM_WORKBENCH_CONTAINER: "1"
      THEOREM_Z3: "z3"
    volumes:
      - .:/workspace
      - theorem_node_modules:/workspace/node_modules
      - theorem_npm_cache:/home/theorem/.npm
    command: ["npm", "run", "check"]

  mcp:
    <<: *theorem-security
    build:
      context: .
      target: dev
    image: theorem-workbench:dev
    working_dir: /workspace
    network_mode: "none"
    environment:
      CI: "true"
      NPM_CONFIG_UPDATE_NOTIFIER: "false"
      THEOREM_WORKBENCH_CONTAINER: "1"
      THEOREM_Z3: "z3"
    volumes:
      - .:/workspace
      - theorem_node_modules:/workspace/node_modules
      - theorem_npm_cache:/home/theorem/.npm
    command: ["npm", "run", "mcp"]
    stdin_open: true

  web:
    <<: *theorem-security
    build:
      context: .
      target: dev
    image: theorem-workbench:dev
    working_dir: /workspace
    environment:
      CI: "true"
      NPM_CONFIG_UPDATE_NOTIFIER: "false"
      THEOREM_WORKBENCH_CONTAINER: "1"
      THEOREM_Z3: "z3"
    volumes:
      - .:/workspace
      - theorem_node_modules:/workspace/node_modules
      - theorem_npm_cache:/home/theorem/.npm
    command: ["npm", "run", "web:serve", "--", "--host", "0.0.0.0", "--port", "4180"]
    ports:
      - "127.0.0.1:4180:4180"

volumes:
  theorem_node_modules:
  theorem_npm_cache:
