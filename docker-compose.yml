name: truth-harness

x-truth-harness-security: &truth-harness-security
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  pids_limit: 1024

services:
  truth-harness:
    <<: *truth-harness-security
    build:
      context: .
      target: dev
    image: truth-harness:dev
    working_dir: /workspace
    network_mode: "none"
    environment:
      CI: "true"
      NPM_CONFIG_UPDATE_NOTIFIER: "false"
      TRUTH_HARNESS_CONTAINER: "1"
      TRUTH_HARNESS_MAXIMA: "maxima-sage"
      TRUTH_HARNESS_Z3: "z3"
      TRUTH_HARNESS_CVC5: "cvc5"
    volumes:
      - .:/workspace
      - truth_harness_node_modules:/workspace/node_modules
      - truth_harness_npm_cache:/home/truth/.npm
    command: ["npm", "run", "check"]

  engine-smoke:
    <<: *truth-harness-security
    image: truth-harness:dev
    working_dir: /workspace
    network_mode: "none"
    environment:
      CI: "true"
      NPM_CONFIG_UPDATE_NOTIFIER: "false"
      TRUTH_HARNESS_CONTAINER: "1"
      TRUTH_HARNESS_MAXIMA: "maxima-sage"
      TRUTH_HARNESS_Z3: "z3"
      TRUTH_HARNESS_CVC5: "cvc5"
    command: ["npm", "run", "cli", "--", "engines", "verify", "--require-maxima", "--require-z3", "--require-cvc5"]

  professor-evidence:
    <<: *truth-harness-security
    image: truth-harness:lean-proof
    working_dir: /workspace
    network_mode: "none"
    environment:
      CI: "true"
      NPM_CONFIG_UPDATE_NOTIFIER: "false"
      TRUTH_HARNESS_CONTAINER: "1"
      TRUTH_HARNESS_LEAN: "lean"
      TRUTH_HARNESS_MAXIMA: "maxima-sage"
      TRUTH_HARNESS_Z3: "z3"
      TRUTH_HARNESS_CVC5: "cvc5"
    volumes:
      - ./.truth-harness:/workspace/.truth-harness
      - ./docs/examples/lean-repair-fixture:/workspace/docs/examples/lean-repair-fixture
    command: ["npm", "run", "professor:evidence"]

  sage-math:
    <<: *truth-harness-security
    build:
      context: .
      target: sage-math
    image: truth-harness:sage-math
    working_dir: /workspace
    network_mode: "none"
    environment:
      CI: "true"
      NPM_CONFIG_UPDATE_NOTIFIER: "false"
      TRUTH_HARNESS_CONTAINER: "1"
      TRUTH_HARNESS_SAGE: "sage"
    command: ["npm", "run", "engines:verify:sage"]

  all-engines:
    <<: *truth-harness-security
    build:
      context: .
      target: all-engines
    image: truth-harness:all-engines
    working_dir: /workspace
    network_mode: "none"
    environment:
      CI: "true"
      NPM_CONFIG_UPDATE_NOTIFIER: "false"
      TRUTH_HARNESS_CONTAINER: "1"
      TRUTH_HARNESS_MAXIMA: "maxima-sage"
      TRUTH_HARNESS_Z3: "z3"
      TRUTH_HARNESS_CVC5: "cvc5"
      TRUTH_HARNESS_LEAN: "lean"
      TRUTH_HARNESS_SAGE: "sage"
    volumes:
      - ./.truth-harness:/workspace/.truth-harness
    command: ["npm", "run", "engines:verify:all"]

  professor-evidence-all:
    <<: *truth-harness-security
    build:
      context: .
      target: all-engines
    image: truth-harness:all-engines
    working_dir: /workspace
    network_mode: "none"
    environment:
      CI: "true"
      NPM_CONFIG_UPDATE_NOTIFIER: "false"
      TRUTH_HARNESS_CONTAINER: "1"
      TRUTH_HARNESS_MAXIMA: "maxima-sage"
      TRUTH_HARNESS_Z3: "z3"
      TRUTH_HARNESS_CVC5: "cvc5"
      TRUTH_HARNESS_LEAN: "lean"
      TRUTH_HARNESS_SAGE: "sage"
    volumes:
      - ./.truth-harness:/workspace/.truth-harness
      - ./docs/examples/lean-repair-fixture:/workspace/docs/examples/lean-repair-fixture
    command: ["npm", "run", "professor:evidence", "--", "--all-engines"]

  mcp:
    <<: *truth-harness-security
    image: truth-harness:dev
    working_dir: /workspace
    network_mode: "none"
    environment:
      CI: "true"
      NPM_CONFIG_UPDATE_NOTIFIER: "false"
      TRUTH_HARNESS_CONTAINER: "1"
      TRUTH_HARNESS_MAXIMA: "maxima-sage"
      TRUTH_HARNESS_Z3: "z3"
      TRUTH_HARNESS_CVC5: "cvc5"
    volumes:
      - .:/workspace
      - truth_harness_node_modules:/workspace/node_modules
      - truth_harness_npm_cache:/home/truth/.npm
    command: ["npm", "run", "mcp"]
    stdin_open: true

  web:
    <<: *truth-harness-security
    build:
      context: .
      target: dev
    image: truth-harness:dev
    working_dir: /workspace
    environment:
      CI: "true"
      NPM_CONFIG_UPDATE_NOTIFIER: "false"
      TRUTH_HARNESS_CONTAINER: "1"
      TRUTH_HARNESS_MAXIMA: "maxima-sage"
      TRUTH_HARNESS_Z3: "z3"
      TRUTH_HARNESS_CVC5: "cvc5"
    volumes:
      - .:/workspace
      - truth_harness_node_modules:/workspace/node_modules
      - truth_harness_npm_cache:/home/truth/.npm
    command: ["npm", "run", "web:serve", "--", "--host", "0.0.0.0", "--port", "4180"]
    networks:
      - web_isolated

  web-gateway:
    <<: *truth-harness-security
    build:
      context: .
      target: dev
    image: truth-harness:dev
    working_dir: /workspace
    environment:
      TRUTH_HARNESS_GATEWAY_HOST: "0.0.0.0"
      TRUTH_HARNESS_GATEWAY_PORT: "4180"
      TRUTH_HARNESS_WEB_HOST: "web"
      TRUTH_HARNESS_WEB_PORT: "4180"
    command: ["node", "tools/local-web-gateway.mjs"]
    depends_on:
      - web
    ports:
      - "127.0.0.1:4180:4180"
    networks:
      - web_isolated
      - web_ingress

  lean-proof:
    <<: *truth-harness-security
    build:
      context: .
      target: lean-proof
    image: truth-harness:lean-proof
    working_dir: /workspace
    network_mode: "none"
    environment:
      CI: "true"
      NPM_CONFIG_UPDATE_NOTIFIER: "false"
      TRUTH_HARNESS_CONTAINER: "1"
      TRUTH_HARNESS_LEAN: "lean"
    volumes:
      - ./.truth-harness:/workspace/.truth-harness
      - ./docs/examples/lean-repair-fixture:/workspace/docs/examples/lean-repair-fixture
    command: ["npm", "run", "proof:lean-suite"]

  mathlib-proof:
    <<: *truth-harness-security
    image: truth-harness:mathlib-proof
    working_dir: /workspace
    network_mode: "none"
    environment:
      CI: "true"
      NPM_CONFIG_UPDATE_NOTIFIER: "false"
      TRUTH_HARNESS_CONTAINER: "1"
      TRUTH_HARNESS_LEAN: "lean"
    volumes:
      - ./.truth-harness:/workspace/.truth-harness
    command: ["npm", "run", "proof:mathlib-template:check"]

volumes:
  truth_harness_node_modules:
  truth_harness_npm_cache:

networks:
  web_isolated:
    internal: true
  web_ingress:
