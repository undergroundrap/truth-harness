name: Dependency Audit

on:
  push:
    branches: [main]
    paths:
      - '**/package.json'
      - package-lock.json
      - .github/workflows/dependency-audit.yml
  pull_request:
  schedule:
    - cron: '20 13 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  npm-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Audit runtime and development dependencies in Docker
        run: >-
          docker run --rm --cap-drop ALL --security-opt no-new-privileges
          --user 10001:10001 -e NPM_CONFIG_CACHE=/tmp/npm-cache
          -e NPM_CONFIG_UPDATE_NOTIFIER=false
          --mount type=bind,source="$PWD",target=/workspace,readonly
          --workdir /workspace node:22-bookworm-slim
          npm audit --package-lock-only --ignore-scripts --audit-level=low
