name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: npm ci

      - name: Install symbolic adapter dependency
        run: python -m pip install sympy==1.14.0

      - name: Build and test
        run: npm run check

      - name: Run launch proof suite
        run: npm run proof:launch

  lean-reduction-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The lean-proof target embeds legacy success gates requiring `proved`.
      # Compilation is diagnostic-only until an independent checker adapter exists.
      - name: Build pinned Lean 4.12 compilation environment
        run: docker build --target lean-environment -t truth-harness:lean-admission .
      - name: Required Lean compilation, negative controls, and fail-closed proof admission
        run: |
          docker run --rm --network none --cap-drop ALL --security-opt no-new-privileges \
            --mount "type=bind,source=$PWD,target=/repo,readonly" \
            --tmpfs /workspace/.truth-harness:uid=10001,gid=10001 \
            --workdir /workspace \
            -e TRUTH_HARNESS_REQUIRE_LEAN_TESTS=1 -e TRUTH_HARNESS_TEST_REAL_LEAN=1 \
            truth-harness:lean-admission sh -ec '
              tar -C /repo --exclude=node_modules --exclude=.git --exclude=.truth-harness --exclude=dist --exclude="*.tsbuildinfo" -cf - . | tar -C /workspace -xf -
              npm run build
              npm test -- tools/lean-proof-admission.test.js packages/core/src/proof-backend.test.ts
            '

  bezier-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prepare non-root evidence directory
        run: sudo install -d -o 10001 -g 10001 -m 0755 .truth-harness
      - name: Real-engine Bezier checks and missing-verifier control
        run: docker compose run --build --rm -T pit-experiment node tools/bezier-gate.mjs
      - name: Docker recurrence verification and receipt replay
        run: docker compose run --rm -T -e TRUTH_HARNESS_REQUIRE_DOCKER_TESTS=1 check npm test -- tools/cs-triples.test.js tools/exponential-recurrence.test.js tools/cs-recurrence-reuse.test.js tools/recurrence-reopen.test.js tools/cs-divide-conquer.test.js tools/cs-divide-conquer-bundle.test.js
