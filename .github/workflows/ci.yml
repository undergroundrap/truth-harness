name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: npm ci

      - name: Install symbolic adapter dependency
        run: python -m pip install sympy==1.14.0

      - name: Build and test
        run: npm run check

      - name: Run launch proof suite
        run: npm run proof:launch

  bezier-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prepare non-root evidence directory
        run: sudo install -d -o 10001 -g 10001 -m 0755 .truth-harness
      - name: Real-engine Bezier checks and missing-verifier control
        run: docker compose run --build --rm -T pit-experiment node tools/bezier-gate.mjs
      - name: Docker triple-count verification and receipt replay
        run: docker compose run --rm -T -e TRUTH_HARNESS_REQUIRE_DOCKER_TESTS=1 check npm test -- tools/cs-triples.test.js
